<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Canteen</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <img src="images/canteen-logo.png" alt="Canteen Logo" class="login-logo">
            <h2>College Canteen Login</h2>
            <p>Access your canteen account to order or manage</p>
        </div>

        <div class="login-body">
            <form id="loginForm" onsubmit="loginUser(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label for="userType">Select User Role</label>
                    <select id="userType">
                        <option value="student">Student / Customer</option>
                        <option value="admin">Administrator</option>
                        <option value="kitchen">Kitchen Staff</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">Login to Canteen</button>
            </form>

            <div class="login-footer">
                <a href="index.html">← Back to Canteen Home</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
